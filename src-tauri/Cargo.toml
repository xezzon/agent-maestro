[package]
name = "agent-maestro"
# 不写 version：应用版本号唯一来源是 tauri.conf.json（Cargo 省略该字段时按 0.0.0 处理，
# 于是 Cargo.lock 不再随发版变动、CI 缓存 key 也不再轮换，见 ADR 0012）。
description = "An APP for managing agents profile unified."
authors = ["xezzon <agent-maestro@xezzon.xyz>"]
edition = "2024"
repository = "https://github.com/xezzon/agent-maestro"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 读 tauri.conf.json 的 version 注入 AGENT_MAESTRO_APP_VERSION（ADR 0012）。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking"] }
url = "2"
wasmtime = { version = "48.0.1", features = ["component-model", "wat"] }
wasmtime-wasi = "48.0.1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
