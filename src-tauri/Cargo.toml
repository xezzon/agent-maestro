[package]
name = "agent-maestro"
# 不写 version：应用版本号唯一来源是 tauri.conf.json（Cargo 省略该字段时按 0.0.0 处理，
# 于是 Cargo.lock 不再随发版变动、CI 缓存 key 也不再轮换，见 ADR 0012）。
description = "An APP for managing agents profile unified."
authors = ["xezzon <agent-maestro@xezzon.xyz>"]
edition = "2024"
repository = "https://github.com/xezzon/agent-maestro"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 读 tauri.conf.json 的 version 注入 AGENT_MAESTRO_APP_VERSION（ADR 0012）。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# preserve_order：manifest 的 settings_schema 由插件作者手写，其 properties 顺序即
# 表单字段的渲染顺序（ADR 0017），默认的 BTreeMap 会按字典序重排，透传就名不副实。
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking"] }
url = "2"
wasmtime = { version = "48.0.1", features = ["component-model", "wat"] }
wasmtime-wasi = "48.0.1"
# 占位符插值（ADR 0014）：`${name}`/`$name`/`${name:default}`，反斜杠转义。
subst = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

# 系统密钥链（ADR 0002）：按平台分依赖，每个平台只带自己那一个后端。
# 不支持的编译目标因此拿不到 keyring 依赖——`secret` 模块在那些目标上编译期
# 即失败，绝不静默回退到内存实现（见 `src/secret/mod.rs` 的 compile_error）。
# 不启用 keyutils：Linux 走 Secret Service（与 GLOSSARY「密钥链」的定义一致）。
[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(target_os = \"windows\")".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target."cfg(target_os = \"linux\")".dependencies]
# crypto-rust：Secret Service 的加解密走纯 Rust 实现，不拖 OpenSSL 系统库。
# vendored：D-Bus 客户端库（libdbus）就地编译，Linux CI 不必预装 libdbus 开发包。
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
