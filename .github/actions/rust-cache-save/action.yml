name: Save cargo caches
description: 按开关保存 cargo home 与指定 profile 的构建产物缓存，可在保存前驱逐本 profile 的旧条目。

# 本 action 是 .github/actions/rust-cache-restore 的写入侧，缓存格式与约定见那里。
# - 是否写入由 `write` 开关决定：Check 只在 push 到 main 时传 'true'，非 main 分支（PR、
#   workflow_dispatch）传 'false' 只读不写。注意 `pull_request` 不受官方「低信任默认只读」
#   的保护：文档明确 PR 运行仍会写 refs/pull/N/merge 作用域的缓存，因此必须显式限制。
#   之所以把 restore 与 save 拆成两步，正是因为原生 actions/cache 的 post 保存无法条件化。
# - 命中即跳过：与原生 actions/cache 的保存语义一致 —— 主键精确命中说明存档内容不变，
#   重复上传没有意义；主键由 cache-restore 透传，保证恢复与保存用的是同一个 key。
# - `evict` 打开时，先删掉本仓库全部同 profile 的旧条目（跨 ref），再写本次这一份：
#   单条约 2.3 GiB，留两份以上就会顶满仓库 10 GiB 的配额，触发 LRU 驱逐时连其它 profile
#   的缓存也会被清掉。查询刻意不带 ref（API 缺省返回所有 ref），这样早期留在
#   refs/pull/*/merge 上的同名条目也会一并清掉；key 过滤是前缀匹配，正好覆盖
#   `<profile>-` 后接任意哈希的组合。若驱逐成功而紧随其后的保存失败，会短暂失去缓存
#   （下一次 main 运行重建）。删除缓存需要调用方 job 上的 `actions: write` 权限。

inputs:
  profile:
    description: 产物缓存 profile，须与 cache-restore 传入的一致。
    required: true
  write:
    description: 是否写入缓存（'true'/'false'）。非 main 分支传 'false' 只读不写。
    required: true
  evict:
    description: 保存前是否驱逐本 profile 的全部旧条目（'true'/'false'）。
    required: false
    default: 'false'
  home-hit:
    description: cache-restore 的 home-hit 输出。
    required: true
  home-key:
    description: cache-restore 的 home-key 输出。
    required: true
  artifact-hit:
    description: cache-restore 的 artifact-hit 输出。
    required: true
  artifact-key:
    description: cache-restore 的 artifact-key 输出。
    required: true

runs:
  using: composite
  steps:
    # 先驱逐再保存：不这么做，新条目会把旧的顶下去，配额溢出时 LRU 会连别的 profile 一起清掉。
    - name: Evict old build artifact caches
      if: inputs.write == 'true' && inputs.evict == 'true' && inputs.artifact-hit != 'true'
      shell: bash
      env:
        # composite action 拿不到 secrets 上下文，用等价的 github.token；删除缓存需要 actions: write。
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PREFIX: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-
      run: |
        # 先把 id 全部列完再删：边翻页边删会让后续页的偏移错位、漏掉条目。
        ids=$(gh api --paginate \
          "repos/${REPO}/actions/caches?key=${PREFIX}&per_page=100" \
          --jq '.actions_caches[].id')
        for id in ${ids}; do
          echo "deleting build artifact cache ${id}"
          gh api -X DELETE "repos/${REPO}/actions/caches/${id}"
        done

    - name: Save cargo home
      if: inputs.write == 'true' && inputs.home-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ inputs.home-key }}
        # 与 Restore cargo home 同步：save 侧同样默认只接受同 OS 的恢复，须显式打开。
        enableCrossOsArchive: true

    - name: Save build artifacts
      if: inputs.write == 'true' && inputs.artifact-hit != 'true'
      uses: actions/cache/save@v6
      with:
        # 与 Restore build artifacts 保持同一组路径（同样不含 crates/maestro-plugin-sdk/target/）。
        path: |
          src-tauri/target/
          # 插件 wasm 在宿主构建（build.rs）时编译，产物缓存在插件自己的 target 目录。
          plugins/pi/target/
        key: ${{ inputs.artifact-key }}
