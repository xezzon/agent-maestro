name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm' # Only available in public repos.
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      # 插件 wasm 在宿主构建（build.rs）时编译，会运行插件的 Cargo build scripts，
      # 不得保留 GITHUB_TOKEN 凭据。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # 仅 Intel mac 产物需要跨编译 target；macos-latest 宿主默认已含 aarch64-apple-darwin。
      - name: Install Rust target (Intel mac)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        run: rustup target add x86_64-apple-darwin

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xdg-utils（xdg-open）是 AppImage 打包的必需项；ubuntu-22.04-arm 镜像未预装。
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      # key 带 os/arch 前缀：与 Check 工作流按 runner.os 写入的缓存区分开，
      # 并区分 matrix 中两个共用 macos-latest 的条目（ARM64 / X64）。
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            # 插件 wasm 在宿主构建（build.rs）时编译，产物缓存在插件自己的 target 目录。
            plugins/pi/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本号取自 tauri.conf.json，产物附加到同名的 Draft Release，人工确认后发布。
      # static json（latest.json，updater 的静态端点）由此 step 生成：自动合并
      # matrix 各平台条目后上传到 Release。当前应用尚未启用 updater，此功能暂不生效；
      # 待 tauri.conf.json 配置 createUpdaterArtifacts 与 updater 插件后自动激活，
      # 签名密钥取自 secrets（未启用 updater 时以下 env 会被忽略）。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Agent Maestro v__VERSION__'
          releaseDraft: true
          prerelease: false
          # 生成 latest.json（默认已开，显式声明以示用途）。
          uploadUpdaterJson: true
          # Windows 更新包优先 NSIS 安装器（默认选 MSI 只是历史兼容行为）。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # maestro-plugin-sdk 发布 crates.io（issue #41）。SDK 版本与 WIT 包版本按 semver
  # 对齐（SDK 1.x ↔ maestro:plugin 1.x，breaking 升 major）；应用发版触发同一 tag，
  # 版本未变时自动跳过。
  publish-sdk:
    name: Publish maestro-plugin-sdk to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify SDK / WIT version alignment
        id: version
        run: |
          wit_version=$(sed -n 's/^package maestro:plugin@\([0-9][0-9.]*\);/\1/p' wit/maestro-plugin.wit)
          sdk_version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' crates/maestro-plugin-sdk/Cargo.toml | head -1)
          wit_major=${wit_version%%.*}
          sdk_major=${sdk_version%%.*}
          if [ -z "$wit_version" ] || [ -z "$sdk_version" ] || [ "$wit_major" != "$sdk_major" ]; then
            echo "Version misalignment: maestro:plugin@$wit_version vs maestro-plugin-sdk@$sdk_version (convention: SDK 1.x <-> WIT 1.x)"
            exit 1
          fi
          echo "Aligned: maestro:plugin@$wit_version <-> maestro-plugin-sdk@$sdk_version"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"

      # crates.io 包必须自包含：包根之外的 wit/ 无法打进包，发布前把合同拷入
      # crate 目录（未 gitignore 以便打包；SDK build.rs 仅在包外无仓库 wit/ 时回退用它）。
      - name: Copy WIT contract into the SDK crate
        run: |
          mkdir -p crates/maestro-plugin-sdk/wit
          cp wit/maestro-plugin.wit crates/maestro-plugin-sdk/wit/

      - name: Skip if version already published
        id: published
        run: |
          if curl -fsS -o /dev/null "https://crates.io/api/v1/crates/maestro-plugin-sdk/${{ steps.version.outputs.sdk_version }}"; then
            echo "maestro-plugin-sdk@${{ steps.version.outputs.sdk_version }} already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        working-directory: crates/maestro-plugin-sdk
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
