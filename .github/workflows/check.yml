name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 删除缓存需要 actions: write。job 级 permissions 覆盖工作流级的 contents: read，
    # 故须在这里把 contents 再列一遍。这一步授予会执行 PR 代码的 job 写权限，但 cache-save
    # 里的驱逐步骤由 write 开关门控（本 job 只在 push 到 main 时传 true），凭据只在那个
    # 步骤的 env 里注入：非 main 运行（含 PR）走不到它，fork PR 更是会被 GitHub 强制降级为只读。
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: src-tauri
    env:
      # CI 不需要增量编译：job 内 clippy 与 test 用不同驱动与参数、互不共享产物，
      # 跨运行靠缓存。关掉它能省下 target/debug 里那一大块增量数据，恢复与保存都更快。
      CARGO_INCREMENTAL: "0"
    steps:
      # 插件 wasm 在宿主构建（build.rs）时编译，会运行插件的 Cargo build scripts，
      # 不得保留 GITHUB_TOKEN 凭据。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # GitHub 托管的运行器包含最新版本的 Rust 工具链。
      - name: Output rust version for educational purposes
        run: |
          rustc --version
          cargo --version

      # 缓存约定与实现见 .github/actions/rust-cache-restore（恢复）与 rust-cache-save（保存 + 驱逐）；
      # 本 job 只负责传 profile 与「main 才写」的开关。
      - name: Restore caches
        id: cache
        uses: ./.github/actions/rust-cache-restore
        with:
          profile: cargo-test

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # SDK crate 是独立 package（无 workspace 覆盖），单独跑 fmt 与 clippy；
      # 作为库 crate 不提交 Cargo.lock，故不用 --locked。
      - name: Format (maestro-plugin-sdk)
        run: cargo fmt --check
        working-directory: crates/maestro-plugin-sdk

      - name: Clippy (maestro-plugin-sdk)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/maestro-plugin-sdk

      # 构建全部结束后再保存：写入门控、命中跳过与旧条目驱逐都在 rust-cache-save 里，
      # 这里只把 profile、开关与 rust-cache-restore 透出的结果传进去。
      - name: Save caches
        uses: ./.github/actions/rust-cache-save
        with:
          profile: cargo-test
          write: ${{ github.ref == 'refs/heads/main' }}
          evict: 'true'
          home-hit: ${{ steps.cache.outputs.home-hit }}
          home-key: ${{ steps.cache.outputs.home-key }}
          artifact-hit: ${{ steps.cache.outputs.artifact-hit }}
          artifact-key: ${{ steps.cache.outputs.artifact-key }}
