name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # fmt 只读源码：不取依赖、不编译、不恢复缓存。独立成轻量 job 后，格式问题十几秒内反馈，
  # 也不再占用 rust job 的时间。
  fmt:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # 与其余 Rust job 保持一致：不把 GITHUB_TOKEN 凭据留在工作区。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Format
        run: cargo fmt --check

      # SDK crate 是独立 package（无 workspace 覆盖），单独跑 fmt；作为库 crate 不提交 Cargo.lock。
      - name: Format (maestro-plugin-sdk)
        run: cargo fmt --check
        working-directory: crates/maestro-plugin-sdk

  rust:
    name: Rust (clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # 插件 wasm 在宿主构建（build.rs）时编译，会运行插件的 Cargo build scripts，
      # 不得保留 GITHUB_TOKEN 凭据。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 缓存 key 里含 rustc 版本与提交哈希，故先物化 rust-toolchain.toml 指定的工具链再算 key。
      # GitHub 托管的运行器已预装最新版本的 Rust 工具链。
      - name: Output rust version for educational purposes
        run: |
          rustc --version
          cargo --version

      # 缓存约定（与 release.yml 一致）：
      # - key 由 rust-cache 组装为 <平台>/<架构> + rustc 版本与提交哈希 + 各 workspace 的
      #   Cargo.toml/Cargo.lock 哈希，故工具链或依赖图一变就换新 key，旧缓存仍可作为
      #   restore-keys 前缀命中、增量重编；源码不参与 key——源码变更要复用缓存而不是全量重建。
      # - Check 只产出 dev profile 产物，因此不与 Release 共用缓存：Release 及其在默认分支上
      #   的预热 job 用 shared-key: release-<平台槽位>，只缓存 release profile 产物，
      #   避免两种 profile 互相挤占同一份缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          # 编译发生在这三处：宿主、宿主 build.rs 就地编译的内置插件 wasm、独立 SDK crate。
          workspaces: |
            src-tauri
            plugins/pi
            crates/maestro-plugin-sdk

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # SDK crate 是独立 package（无 workspace 覆盖），单独跑 clippy；
      # 作为库 crate 不提交 Cargo.lock，故不用 --locked。
      - name: Clippy (maestro-plugin-sdk)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/maestro-plugin-sdk
