name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # GitHub 托管的运行器包含最新版本的 Rust 工具链。
      - name: Output rust version for educational purposes
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  plugin:
    name: Plugin (pi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/pi
    steps:
      - uses: actions/checkout@v7

      # GitHub 托管的运行器包含最新版本的 Rust 工具链，仓库根 rust-toolchain.toml 锁定实际版本。
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            plugins/pi/target/
          key: ${{ runner.os }}-cargo-plugin-${{ hashFiles('plugins/pi/Cargo.lock') }}

      # build.sh 内含路径重映射，保证构建字节级可复现，产物覆盖 plugin.wasm。
      - name: Build
        run: bash build.sh

      # 构建产物必须与已提交的 plugin.wasm 一致，防止 wasm 产物与源码漂移。
      - name: Check committed plugin.wasm is up to date
        run: git diff --exit-code -- plugin.wasm
