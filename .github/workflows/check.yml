name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # 插件 wasm 在宿主构建（build.rs）时编译，会运行插件的 Cargo build scripts，
      # 不得保留 GITHUB_TOKEN 凭据。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # GitHub 托管的运行器包含最新版本的 Rust 工具链。
      - name: Output rust version for educational purposes
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            # 插件 wasm 在宿主构建（build.rs）时编译，产物缓存在插件自己的 target 目录。
            plugins/pi/target/
          # key 与 Release 工作流保持一致：tag 触发的 Release 运行可读取默认分支
          # （本工作流 push 到 main 时）保存的缓存。os/arch 前缀区分平台。
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # SDK crate 是独立 package（无 workspace 覆盖），单独跑 fmt 与 clippy；
      # 作为库 crate 不提交 Cargo.lock，故不用 --locked。
      - name: Format (maestro-plugin-sdk)
        run: cargo fmt --check
        working-directory: crates/maestro-plugin-sdk

      - name: Clippy (maestro-plugin-sdk)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/maestro-plugin-sdk
